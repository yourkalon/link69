*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{background:#000;color:#fff;overflow:hidden}
.reels-container{
  height:100vh;
  width:100vw;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
}
.reel{
  position:relative;
  width:100vw;
  height:100vh;
  scroll-snap-align:start;
  cursor:pointer;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
}
.reel img{
  width:100vw;
  height:100vh;
  object-fit:cover;
  object-position:center;
  display:block;
}
.profile-section,
.caption,
.right-icons,
.play-button {
  position:absolute;
  z-index:5;
}
.profile-section{
  bottom:95px;
  left:12px;
  display:flex;
  align-items:center;
  gap:8px;
}
.caption{
  bottom:50px;
  left:12px;
  font-size:13px;
  width:70vw;
  line-height:1.3;
  color:#f1f1f1;
  text-shadow:0 1px 2px #000;
}
.right-icons{
  right:10px;
  bottom:130px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}
.play-button{
  top:48%;
  left:50%;
  transform:translate(-50%,-50%);
  width:58px;height:58px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.25);
  border-radius:50%;
}
.play-button img{width:28px;height:28px;filter:invert(1)}
.icon{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer}
.icon i{font-size:24px;color:white;}
.icon span{font-size:12px;font-weight:500;color:#eaeaea;margin-top:4px}
.profile-ring{
  width:30px;height:30px;
  border-radius:50%;
  border:1.5px solid #2e89ff;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.profile-ring img{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(0.85);
  border-radius:50%;
}
.username{
  font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:4px;
}
.verify-box{
  width:12px;height:12px;background:#2e89ff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.verify-box i{color:#fff;font-size:7px}
.follow-btn{
  background:#fff;color:#000;border:none;border-radius:6px;
  padding:2px 7px;font-size:11px;font-weight:600;cursor:pointer;
}
.reels-container::-webkit-scrollbar{display:none}
